<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spine Web Player</title>
  
  <!-- Spine Player 4.2.* (최신 패치 버전) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2.*/dist/spine-player.css">
  
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #191919;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #player-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="player-container"></div>

  <!-- Spine Player JS 4.2.* -->
  <script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2.*/dist/iife/spine-player.js"></script>

  <script>
    window.addEventListener('load', () => {
      
      if (typeof spine === 'undefined') {
        console.error("Spine 라이브러리 로드 실패: 네트워크 상태 또는 CDN 경로를 확인하세요.");
        return;
      }

      let currentPlayer = null;

      const urlParams = new URLSearchParams(window.location.search);
      // URL 파라미터가 없으면 기본값으로 'work_260828' 로드
      const modelParam = urlParams.get('model') || "work_260828";
      const bgParam = urlParams.get('bg') || "#191919";

      function loadSpineModel(modelName) {
        if (currentPlayer) {
          currentPlayer.dispose();
          document.getElementById("player-container").innerHTML = "";
        }

        const isTransparent = bgParam.toLowerCase() === "transparent";
        const backgroundColor = isTransparent ? "#00000000" : bgParam;

        currentPlayer = new spine.SpinePlayer("player-container", {
          skelUrl: `${modelName}.skel`,
          atlasUrl: `${modelName}.atlas`,
          showControls: true,
          premultipliedAlpha: true,
          alpha: isTransparent,
          backgroundColor: backgroundColor,
          viewport: {
            padLeft: "5%",
            padRight: "5%",
            padTop: "5%",
            padBottom: "5%"
          },
          error: (player, reason) => {
            console.error(`Spine 모델 [${modelName}] 로드 실패:`, reason);
          }
        });
      }

      loadSpineModel(modelParam);
    });
  </script>

</body>
</html>
