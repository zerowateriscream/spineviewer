<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spine Viewer</title>
  <!-- Spine Web Player CSS / JS (버전 맞춤 필요) -->
  <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.1.*/dist/spine-player.css">
  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.*/dist/iife/spine-player.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #191919;
      overflow: hidden;
    }
    #player-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="player-container"></div>

  <script>
    new spine.SpinePlayer("player-container", {
      jsonUrl: "character.json",   // 업로드한 json 파일명
      atlasUrl: "character.atlas", // 업로드한 atlas 파일명
      animation: "idle",           // 재생할 기본 애니메이션 이름
      showControls: true,          // 하단 재생바/속도/믹스 컨트롤러 표시
      premultipliedAlpha: true,    // 알파 블렌딩 설정 (필요에 따라 true/false)
      backgroundColor: "#191919"
    });
  </script>

</body>
</html>
