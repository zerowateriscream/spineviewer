<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spine Web Player</title>
  
  <!-- Spine Player 4.2.* (최신 패치 버전) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2.*/dist/spine-player.css">
  
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #191919;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #player-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="player-container"></div>

  <!-- Spine Player JS 4.2.* -->
  <script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2.*/dist/iife/spine-player.js"></script>

  <script>
    window.addEventListener('load', () => {
      
      if (typeof spine === 'undefined') {
        console.error("Spine 라이브러리 로드 실패: 네트워크 상태 또는 CDN 경로를 확인하세요.");
        return;
      }

      const availableModels = [
        "work_260828",
        "orange_dream_1"
      ];

      let currentPlayer = null;

      const urlParams = new URLSearchParams(window.location.search);
      const modelParam = urlParams.get('model');
      const bgParam = urlParams.get('bg') || "#191919";

      function loadSpineModel(modelName) {
        if (currentPlayer) {
          currentPlayer.dispose();
          document.getElementById("player-container").innerHTML = "";
        }

        currentPlayer = new spine.SpinePlayer("player-container", {
          skelUrl: `${modelName}.skel`,
          atlasUrl: `${modelName}.atlas`,
          showControls: true, // 하단 재생 바를 제거하려면 false로 설정
          premultipliedAlpha: true,
          backgroundColor: bgParam === "transparent" ? "#00000000" : bgParam,
          error: (player, reason) => {
            console.error(`Spine 모델 [${modelName}] 로드 실패:`, reason);
          }
        });
      }

      // URL 매개변수의 model 값이 유효하면 지정된 모델을, 없으면 첫 번째 모델을 로드
      const targetModel = (modelParam && availableModels.includes(modelParam)) ? modelParam : availableModels[0];
      loadSpineModel(targetModel);
    });
  </script>

</body>
</html>
