<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spine Web Player</title>
  <!-- Spine Web Player 4.2 CDN -->
  <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.00/dist/spine-player.css">
  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.00/dist/iife/spine-player.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #191919;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #ui-container {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 10px;
      background: rgba(30, 30, 30, 0.85);
      padding: 8px 12px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    select {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    select:hover {
      border-color: #666;
    }
    #player-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <select id="model-select"></select>
    <select id="skin-select"></select>
    <select id="anim-select"></select>
  </div>

  <div id="player-container"></div>

  <script>
    // 1. 관리할 모델 목록 (확장자를 제외한 파일명 등록)
    const availableModels = [
      "work_260828",
      "orange_dream_1"
    ];

    let currentPlayer = null;
    const modelSelect = document.getElementById("model-select");
    const skinSelect = document.getElementById("skin-select");
    const animSelect = document.getElementById("anim-select");

    // URL의 ?model= 파라미터 값 추출 함수
    function getModelFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('model');
    }

    // 모델 셀렉터 초기화
    function initModelOptions() {
      modelSelect.innerHTML = "";
      availableModels.forEach((modelName) => {
        const opt = document.createElement("option");
        opt.value = modelName;
        opt.textContent = modelName;
        modelSelect.appendChild(opt);
      });
    }

    // Spine 모델 로드
    function loadSpineModel(modelName) {
      if (currentPlayer) {
        currentPlayer.dispose();
        document.getElementById("player-container").innerHTML = "";
      }

      // 확장자 자동 결합 (.skel, .atlas)
      const skelUrl = `${modelName}.skel`;
      const atlasUrl = `${modelName}.atlas`;

      modelSelect.value = modelName;

      currentPlayer = new spine.SpinePlayer("player-container", {
        skelUrl: skelUrl,
        atlasUrl: atlasUrl,
        showControls: true,
        premultipliedAlpha: true,
        backgroundColor: "#191919",
        success: (player) => {
          updateSkinList(player);
          updateAnimationList(player);
        },
        error: (player, reason) => {
          console.error(`Spine 모델 [${modelName}] 로드 실패:`, reason);
        }
      });
    }

    function updateSkinList(player) {
      skinSelect.innerHTML = "";
      const skins = player.skeleton.data.skins;

      if (skins && skins.length > 0) {
        skins.forEach((skin) => {
          const opt = document.createElement("option");
          opt.value = skin.name;
          opt.textContent = skin.name;
          skinSelect.appendChild(opt);
        });
        skinSelect.style.display = "block";
      } else {
        skinSelect.style.display = "none";
      }
    }

    function updateAnimationList(player) {
      animSelect.innerHTML = "";
      const animations = player.skeleton.data.animations;

      if (animations && animations.length > 0) {
        animations.forEach((anim, idx) => {
          const opt = document.createElement("option");
          opt.value = anim.name;
          opt.textContent = anim.name;
          if (idx === 0) opt.selected = true;
          animSelect.appendChild(opt);
        });

        player.animation = animations[0].name;
      }
    }

    // 이벤트 리스너
    modelSelect.addEventListener("change", (e) => {
      loadSpineModel(e.target.value);
    });

    skinSelect.addEventListener("change", (e) => {
      if (currentPlayer) currentPlayer.setSkin(e.target.value);
    });

    animSelect.addEventListener("change", (e) => {
      if (currentPlayer) currentPlayer.animation = e.target.value;
    });

    // 실행 시작점
    initModelOptions();

    // URL에 model 매파라미터가 있으면 해당 모델을 로드, 없으면 목록의 첫 번째 모델 로드
    const initialModel = getModelFromUrl();
    if (initialModel && availableModels.includes(initialModel)) {
      loadSpineModel(initialModel);
    } else {
      loadSpineModel(availableModels[0]);
    }
  </script>

</body>
</html>
