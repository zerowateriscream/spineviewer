<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spine 4.2 Local Drop Viewer</title>
  <!-- Spine Web Player 4.2 CDN -->
  <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.00/dist/spine-player.css">
  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.00/dist/iife/spine-player.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #191919;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #ui-container {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 10px;
      background: rgba(30, 30, 30, 0.85);
      padding: 8px 12px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    select {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    select:hover {
      border-color: #666;
    }
    #player-container {
      width: 100vw;
      height: 100vh;
    }
    /* 드래그 앤 드롭 오버레이 안내 */
    #drop-zone {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 20px;
      transition: opacity 0.2s;
    }
    #drop-zone.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="drop-zone">
    <h2>Spine 파일을 여기에 드래그 하세요</h2>
    <p style="font-size: 14px; color: #aaa; margin-top: 8px;">(.skel 또는 .json, .atlas, .png 파일을 함께 선택해서 올려주세요)</p>
  </div>

  <div id="ui-container">
    <select id="skin-select"><option value="">스킨 없음</option></select>
    <select id="anim-select"><option value="">애니메이션 없음</option></select>
  </div>

  <div id="player-container"></div>

  <script>
    let currentPlayer = null;
    const skinSelect = document.getElementById("skin-select");
    const animSelect = document.getElementById("anim-select");
    const dropZone = document.getElementById("drop-zone");

    // 드래그 앤 드롭 이벤트 처리
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
      let skelFile = null;
      let atlasFile = null;
      const textures = {};

      for (let file of files) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'skel' || ext === 'json') {
          skelFile = file;
        } else if (ext === 'atlas') {
          atlasFile = file;
        } else if (['png', 'jpg', 'jpeg'].includes(ext)) {
          textures[file.name] = file;
        }
      }

      if (!skelFile || !atlasFile) {
        alert("최소한 .skel(.json) 파일과 .atlas 파일이 모두 포함되어야 합니다.");
        return;
      }

      // Blob URL 생성 (메모리상 가상 경로 부여)
      const skelUrl = URL.createObjectURL(skelFile);
      const atlasUrl = URL.createObjectURL(atlasFile);

      // 아틀라스 내부에서 참조하는 이미지 파일 오버라이드 처리용 커스텀 텍스처 로더 설정
      // Spine 웹 플레이어는 기본적으로 assetLoader를 통해 URL 매핑을 지원합니다.
      loadSpineModel(skelUrl, atlasUrl, textures);
      dropZone.classList.add("hidden");
    }

    function loadSpineModel(skelUrl, atlasUrl, textures) {
      if (currentPlayer) {
        currentPlayer.dispose();
        document.getElementById("player-container").innerHTML = "";
      }

      currentPlayer = new spine.SpinePlayer("player-container", {
        skelUrl: skelUrl,
        atlasUrl: atlasUrl,
        showControls: true,
        premultipliedAlpha: true,
        backgroundColor: "#191919",
        // 가상 텍스처 파일 매핑 로직
        assetLoader: (path, extension) => {
          const fileName = path.split('/').pop();
          if (textures[fileName]) {
            return URL.createObjectURL(textures[fileName]);
          }
          return path;
        },
        success: (player) => {
          updateSkinList(player);
          updateAnimationList(player);
        },
        error: (player, reason) => {
          console.error("Spine 모델 로드 실패:", reason);
          alert("Spine 모델을 불러오는 중 오류가 발생했습니다. 콘솔을 확인해주세요.");
        }
      });
    }

    function updateSkinList(player) {
      skinSelect.innerHTML = "";
      const skins = player.skeleton.data.skins;
      if (skins && skins.length > 0) {
        skins.forEach((skin) => {
          const opt = document.createElement("option");
          opt.value = skin.name;
          opt.textContent = skin.name;
          skinSelect.appendChild(opt);
        });
      }
    }

    function updateAnimationList(player) {
      animSelect.innerHTML = "";
      const animations = player.skeleton.data.animations;
      if (animations && animations.length > 0) {
        animations.forEach((anim, idx) => {
          const opt = document.createElement("option");
          opt.value = anim.name;
          opt.textContent = anim.name;
          if (idx === 0) opt.selected = true;
          animSelect.appendChild(opt);
        });
        player.animation = animations[0].name;
      }
    }

    skinSelect.addEventListener("change", (e) => {
      if (currentPlayer) {
        currentPlayer.setSkin(e.target.value);
      }
    });

    animSelect.addEventListener("change", (e) => {
      if (currentPlayer) {
        currentPlayer.animation = e.target.value;
      }
    });
  </script>

</body>
</html>
